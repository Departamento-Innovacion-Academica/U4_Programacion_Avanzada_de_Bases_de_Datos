<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escalabilidad y Optimización de Bases de Datos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #483C9A;
      --accent-light: #6b5bcf;
      --accent-soft: rgba(72, 60, 154, 0.08);
      --accent-glow: rgba(72, 60, 154, 0.2);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-light: rgba(72, 60, 154, 0.15);
      --radius-lg: 16px;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      overflow-x: hidden;
    }

    /* INSTRUCCIÓN FLOTANTE */
    .floating-instruction {
      background: #ffffff;
      border: 1px solid var(--accent-light);
      color: var(--accent);
      padding: 0.6rem 1.4rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 15px rgba(72, 60, 154, 0.12);
      animation: pulse 2.5s infinite ease-in-out;
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 4px 15px rgba(72, 60, 154, 0.12);
      }
      50% {
        transform: translateY(-3px);
        box-shadow: 0 8px 22px rgba(72, 60, 154, 0.22);
      }
    }

    /* CONTENEDOR PRINCIPAL / GRID */
    .container {
      width: 100%;
      max-width: 1100px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* TARJETAS INTERACTIVAS CENTRADAS */
    .card-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-top: 5px solid var(--accent);
      border-radius: var(--radius-lg);
      height: 210px;
      cursor: pointer;
      text-align: center;
      outline: none;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.8rem;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .card-btn h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.4;
      text-align: center;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      color: var(--accent-light);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-footer span {
      transition: var(--transition-smooth);
      display: inline-block;
    }

    /* EFECTOS HOVER */
    .card-btn:hover, .card-btn:focus-visible {
      transform: translateY(-5px);
      border-color: var(--accent-light);
      border-top-color: var(--accent);
      box-shadow: 0 12px 30px var(--accent-glow);
      background: #ffffff;
    }

    .card-btn:hover .card-footer span {
      transform: translateX(4px);
    }

    /* VENTANA EMERGENTE (MODAL) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition-smooth);
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-top: 6px solid var(--accent);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      transform: scale(0.85) translateY(20px);
      transition: var(--transition-smooth);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .modal-close:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .modal-box h2 {
      font-size: 1.35rem;
      color: var(--accent);
      margin-bottom: 1rem;
      padding-right: 2rem;
      line-height: 1.4;
      text-align: left;
    }

    .modal-box p {
      color: var(--text-main);
      font-size: 1rem;
      line-height: 1.7;
      text-align: left;
    }

    .modal-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
      border-top: 1px solid var(--border-light);
      padding-top: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- INSTRUCCIÓN FLOTANTE -->
  <div class="floating-instruction">
    💡 Haga clic sobre las tarjetas para ampliar la información.
  </div>

  <!-- REJILLA DE TARJETAS -->
  <main class="container">
    <div class="grid-cards">

      <!-- Tarjeta 1 -->
      <button class="card-btn" onclick="openModal('Analizar estrategias de escalabilidad en sistemas de bases de datos', 'Comprender los principios que permiten mejorar la capacidad de los sistemas de bases de datos para soportar mayores volúmenes de información, usuarios y transacciones, identificando enfoques arquitectónicos que favorecen el rendimiento y la disponibilidad del sistema.')">
        <h3>Analizar estrategias de escalabilidad en sistemas de bases de datos</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 2 -->
      <button class="card-btn" onclick="openModal('Evaluar el rendimiento de consultas y procesos en entornos de alta carga', 'Analizar el comportamiento de consultas, procesos y estructuras de datos dentro del sistema gestor, identificando posibles cuellos de botella y aplicando criterios técnicos para mejorar el desempeño del sistema.')">
        <h3>Evaluar el rendimiento de consultas y procesos en entornos de alta carga</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 3 -->
      <button class="card-btn" onclick="openModal('Aplicar mecanismos de optimización para mejorar la eficiencia del sistema', 'Implementar técnicas orientadas a optimizar el acceso a la información, el procesamiento de consultas y la gestión de recursos del sistema gestor de bases de datos, buscando mantener un rendimiento adecuado ante el crecimiento de la carga de trabajo.')">
        <h3>Aplicar mecanismos de optimización para mejorar la eficiencia del sistema</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 4 -->
      <button class="card-btn" onclick="openModal('Diseñar soluciones de bases de datos considerando criterios de escalabilidad', 'Plantear soluciones que integren buenas prácticas de diseño, organización de la información y acceso eficiente a los datos, considerando la evolución futura del sistema y el incremento progresivo de usuarios y datos.')">
        <h3>Diseñar soluciones de bases de datos considerando criterios de escalabilidad</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 5 -->
      <button class="card-btn" onclick="openModal('Desarrollar un proyecto aplicado que integre los conocimientos del curso', 'Elaborar un proyecto que integre los conceptos estudiados a lo largo de la asignatura, aplicando principios de programación en bases de datos, optimización, integración y escalabilidad para resolver un problema práctico relacionado con la gestión de datos.')">
        <h3>Desarrollar un proyecto aplicado que integre los conocimientos del curso</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

    </div>
  </main>

  <!-- PANTALLA EMERGENTE / MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutside(event)">
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">&times;</button>
      <h2 id="modalTitle">Título del resultado</h2>
      <p id="modalBody">Descripción detallada...</p>
      <div class="modal-hint">Presione <strong>Esc</strong> para cerrar</div>
    </div>
  </div>

  <script>
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    function openModal(title, text) {
      modalTitle.innerText = title;
      modalBody.innerText = text;
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    function closeModalOnOutside(event) {
      if (event.target === modalOverlay) {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
