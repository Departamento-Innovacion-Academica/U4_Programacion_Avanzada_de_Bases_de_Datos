<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volumen de Datos - Incremento Progresivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0d131f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Mensaje de instrucción */
    .instruction-text {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 500;
    }

    /* Botón ▶ Reiniciar */
    .restart-btn {
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      background-color: #38bdf8;
      color: #0d131f;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
    }

    .restart-btn:active {
      transform: translateY(0);
    }

    /* Tarjeta Principal */
    .graph-card {
      background-color: #202733;
      border-radius: 20px;
      padding: 35px 40px 30px 40px;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    /* Título del eje Y */
    .y-axis-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 25px;
      letter-spacing: -0.2px;
    }

    /* Contenedor SVG */
    .chart-container {
      width: 100%;
    }

    .chart-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    /* Animación del trazado de la curva */
    .growth-curve {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawCurve 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes drawCurve {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Subtítulo inferior */
    .footer-subtitle {
      color: #94a3b8;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      margin-top: 25px;
      letter-spacing: 0.2px;
    }

    @media (max-width: 520px) {
      .graph-card {
        padding: 24px 20px 20px 20px;
      }

      .y-axis-title {
        font-size: 19px;
        margin-bottom: 15px;
      }

      .footer-subtitle {
        font-size: 13px;
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>

  <p class="instruction-text">Haga clic sobre el botón "▶ Reiniciar" para reiniciar la animación</p>

  <button class="restart-btn" onclick="restartAnimation()">
    ▶ Reiniciar
  </button>

  <div class="graph-card" id="graphWrapper">
    <h2 class="y-axis-title">Volumen de datos</h2>

    <div class="chart-container">
      <svg class="chart-svg" viewBox="0 0 540 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Filtro de Resplandor Neon Glow -->
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- Marcadores/Ticks en el Eje Y -->
        <line x1="82" y1="70" x2="98" y2="70" stroke="#94a3b8" stroke-width="2.5" />
        <line x1="82" y1="120" x2="98" y2="120" stroke="#94a3b8" stroke-width="2.5" />
        <line x1="82" y1="170" x2="98" y2="170" stroke="#94a3b8" stroke-width="2.5" />
        <line x1="82" y1="220" x2="98" y2="220" stroke="#94a3b8" stroke-width="2.5" />

        <!-- Etiquetas del Eje Y -->
        <text x="72" y="75" fill="#94a3b8" font-size="15" font-weight="500" text-anchor="end">20 TB</text>
        <text x="72" y="175" fill="#94a3b8" font-size="15" font-weight="500" text-anchor="end">10 TB</text>

        <!-- Marcadores/Ticks en el Eje X -->
        <line x1="200" y1="232" x2="200" y2="248" stroke="#94a3b8" stroke-width="2.5" />
        <line x1="420" y1="232" x2="420" y2="248" stroke="#94a3b8" stroke-width="2.5" />

        <!-- Etiquetas del Eje X -->
        <text x="200" y="270" fill="#94a3b8" font-size="15" font-weight="500" text-anchor="middle">Año 1</text>
        <text x="420" y="270" fill="#94a3b8" font-size="15" font-weight="500" text-anchor="middle">Año 2</text>
        <text x="310" y="280" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Tiempo</text>

        <!-- Eje Y (Línea sólida + Punta de Flecha) -->
        <line x1="90" y1="240" x2="90" y2="35" stroke="#94a3b8" stroke-width="3" />
        <polygon points="90,20 81,38 99,38" fill="#94a3b8" />

        <!-- Eje X (Línea sólida + Punta de Flecha) -->
        <line x1="90" y1="240" x2="515" y2="240" stroke="#94a3b8" stroke-width="3" />
        <polygon points="530,240 511,231 511,249" fill="#94a3b8" />

        <!-- Curva Creciente Brillante (Neon Cyan Curve) -->
        <path class="growth-curve" d="M 90 238 C 240 235, 410 180, 495 45" fill="none" stroke="#67e8f9"
          stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
      </svg>
    </div>

    <!-- Leyenda / Subtítulo inferior -->
    <p class="footer-subtitle">Incremento progresivo de datos generados por el sistema</p>
  </div>

  <script>
    function restartAnimation() {
      const card = document.getElementById('graphWrapper');
      const clone = card.cloneNode(true);
      card.parentNode.replaceChild(clone, card);
    }
  </script>

</body>

</html>
