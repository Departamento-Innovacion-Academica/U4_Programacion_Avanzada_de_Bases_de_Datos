<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo de Componentes del Sistema</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Mensaje de instrucción */
    .instruction-text {
      color: #334155;
      font-size: 15px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }

    /* Botón ▶ Reiniciar */
    .restart-btn {
      background-color: #202733;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      box-shadow: 0 4px 12px rgba(32, 39, 51, 0.2);
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      background-color: #0d131f;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(32, 39, 51, 0.3);
    }

    .restart-btn:active {
      transform: translateY(0);
    }

    /* Contenedor principal vertical */
    .flow-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
    }

    /* Estructura de Tarjetas Principales */
    .dark-card {
      background-color: #202733;
      border-radius: 16px;
      width: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* Recuadro interior blanco para la ilustración */
    .inner-white-box {
      background-color: #ffffff;
      border-radius: 10px;
      width: 100%;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Título inferior de cada tarjeta */
    .card-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      margin-top: 12px;
      text-align: center;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    /* Flechas triangulares oscuras entre tarjetas */
    .arrow-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 0;
    }

    .arrow-down {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 14px solid #202733;
    }

    /* Badge/Etiqueta BAJA CAPACIDAD */
    .badge-baja {
      position: absolute;
      left: 35px;
      bottom: 22px;
      background-color: #1a1a1a;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .badge-text-group {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .badge-title {
      color: #ef4444;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .badge-sub {
      color: #9ca3af;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .badge-icon {
      width: 18px;
      height: 18px;
      background-color: #dc2626;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
    }

    /* Caja de Nota Final Inferior */
    .footer-box {
      background-color: #202733;
      border-radius: 12px;
      width: 100%;
      padding: 20px 24px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* Animación de entrada descendente */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animated {
      opacity: 0;
      animation: fadeInDown 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .d-1 { animation-delay: 0.05s; }
    .d-2 { animation-delay: 0.15s; }
    .d-3 { animation-delay: 0.25s; }
    .d-4 { animation-delay: 0.35s; }
    .d-5 { animation-delay: 0.45s; }
    .d-6 { animation-delay: 0.55s; }
    .d-7 { animation-delay: 0.65s; }
    .d-8 { animation-delay: 0.75s; }
    .d-9 { animation-delay: 0.85s; }

    @media (max-width: 480px) {
      .card-title {
        font-size: 17px;
      }
      .footer-box {
        font-size: 15px;
        padding: 16px;
      }
      .inner-white-box {
        height: 120px;
      }
      .badge-baja {
        left: 15px;
        bottom: 15px;
        padding: 4px 8px;
      }
      .badge-title {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <p class="instruction-text">Haga clic sobre el botón "▶ Reiniciar" para reiniciar la animación</p>

  <button class="restart-btn" onclick="restartAnimation()">
    ▶ Reiniciar
  </button>

  <div class="flow-container" id="flowWrapper">

    <!-- Tarjeta 1: Usuarios / Aplicaciones -->
    <div class="dark-card animated d-1">
      <div class="inner-white-box">
        <svg width="200" height="100" viewBox="0 0 200 100" fill="none">
          <!-- Laptop -->
          <rect x="25" y="20" width="85" height="52" rx="4" fill="#2d3748"/>
          <rect x="30" y="25" width="75" height="42" rx="2" fill="#805ad5"/>
          <path d="M 15 72 L 120 72 L 115 77 L 20 77 Z" fill="#cbd5e0"/>
          <rect x="52" y="72" width="31" height="3" rx="1" fill="#a0aec0"/>
          <!-- Pantalla Laptop -->
          <polygon points="40,35 60,35 60,55 40,55" fill="#9f7aea"/>
          <circle cx="78" cy="45" r="8" fill="#ed8936"/>

          <!-- Smartphone -->
          <rect x="130" y="15" width="38" height="65" rx="6" fill="#718096"/>
          <rect x="133" y="20" width="32" height="52" rx="3" fill="#38bdf8"/>
          <circle cx="149" cy="74" r="2" fill="#cbd5e0"/>
          <!-- Apps en smartphone -->
          <rect x="137" y="25" width="6" height="6" rx="1" fill="#f6e05e"/>
          <rect x="146" y="25" width="6" height="6" rx="1" fill="#ed8936"/>
          <rect x="155" y="25" width="6" height="6" rx="1" fill="#e53e3e"/>
          <rect x="137" y="34" width="6" height="6" rx="1" fill="#38a169"/>
          <rect x="146" y="34" width="6" height="6" rx="1" fill="#4299e1"/>
          <rect x="155" y="34" width="6" height="6" rx="1" fill="#ed64a6"/>
        </svg>
      </div>
      <div class="card-title">Usuarios / Aplicaciones</div>
    </div>

    <!-- Flecha 1 -->
    <div class="arrow-container animated d-2">
      <div class="arrow-down"></div>
    </div>

    <!-- Tarjeta 2: Servidor de Aplicación -->
    <div class="dark-card animated d-3">
      <div class="inner-white-box">
        <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
          <!-- Rack 1 -->
          <rect x="25" y="10" width="70" height="24" rx="3" fill="#2d3748"/>
          <circle cx="33" cy="22" r="2" fill="#38bdf8"/>
          <circle cx="39" cy="22" r="2" fill="#38bdf8"/>
          <circle cx="45" cy="22" r="2" fill="#38bdf8"/>
          <rect x="65" y="18" width="22" height="8" rx="1" fill="#4a5568"/>

          <!-- Rack 2 -->
          <rect x="25" y="38" width="70" height="24" rx="3" fill="#2d3748"/>
          <circle cx="33" cy="50" r="2" fill="#38bdf8"/>
          <circle cx="39" cy="50" r="2" fill="#38bdf8"/>
          <circle cx="45" cy="50" r="2" fill="#38bdf8"/>
          <rect x="65" y="46" width="22" height="8" rx="1" fill="#4a5568"/>

          <!-- Rack 3 -->
          <rect x="25" y="66" width="70" height="24" rx="3" fill="#2d3748"/>
          <circle cx="33" cy="78" r="2" fill="#38bdf8"/>
          <circle cx="39" cy="78" r="2" fill="#38bdf8"/>
          <circle cx="45" cy="78" r="2" fill="#38bdf8"/>
          <rect x="65" y="74" width="22" height="8" rx="1" fill="#4a5568"/>
        </svg>
      </div>
      <div class="card-title">Servidor de Aplicación</div>
    </div>

    <!-- Flecha 2 -->
    <div class="arrow-container animated d-4">
      <div class="arrow-down"></div>
    </div>

    <!-- Tarjeta 3: Sistema gestor de base de datos -->
    <div class="dark-card animated d-5">
      <div class="inner-white-box">
        <svg width="140" height="100" viewBox="0 0 140 100" fill="none">
          <!-- Base de datos Trasera -->
          <ellipse cx="50" cy="30" rx="22" ry="9" fill="#2b6cb0"/>
          <path d="M 28 30 L 28 55 C 28 60, 72 60, 72 55 L 72 30 Z" fill="#2b6cb0"/>
          <ellipse cx="50" cy="55" rx="22" ry="9" fill="#3182ce"/>
          <circle cx="35" cy="38" r="1.5" fill="#f6e05e"/>

          <!-- Base de datos Frontal -->
          <ellipse cx="80" cy="42" rx="24" ry="10" fill="#2c5282"/>
          <path d="M 56 42 L 56 75 C 56 81, 104 81, 104 75 L 104 42 Z" fill="#2c5282"/>
          <ellipse cx="80" cy="75" rx="24" ry="10" fill="#3182ce"/>
          <circle cx="65" cy="52" r="1.5" fill="#68d391"/>
        </svg>
      </div>
      <div class="card-title">Sistema gestor<br>de base de datos</div>
    </div>

    <!-- Flecha 3 -->
    <div class="arrow-container animated d-6">
      <div class="arrow-down"></div>
    </div>

    <!-- Tarjeta 4: Disco / Almacenamiento (Con etiqueta BAJA CAPACIDAD) -->
    <div class="dark-card animated d-7">
      <div class="inner-white-box">
        <!-- Disco Duro HDD -->
        <svg width="140" height="100" viewBox="0 0 140 100" fill="none">
          <rect x="52" y="10" width="60" height="80" rx="6" fill="#1a202c"/>
          <circle cx="82" cy="42" r="22" fill="#cbd5e0"/>
          <circle cx="82" cy="42" r="7" fill="#a0aec0"/>
          <rect x="58" y="72" width="28" height="10" fill="#4a5568"/>
          <text x="60" y="80" font-size="7" font-weight="bold" fill="#ffffff" font-family="sans-serif">HDD</text>
        </svg>

        <!-- Etiqueta BAJA CAPACIDAD -->
        <div class="badge-baja">
          <div class="badge-text-group">
            <span class="badge-title">BAJA</span>
            <span class="badge-sub">CAPACIDAD</span>
          </div>
          <div class="badge-icon">✕</div>
        </div>
      </div>
      <div class="card-title">Disco / Almacenamiento</div>
    </div>

    <!-- Flecha 4 -->
    <div class="arrow-container animated d-8">
      <div class="arrow-down"></div>
    </div>

    <!-- Mensaje de advertencia final -->
    <div class="footer-box animated d-9">
      Si uno de estos componentes tiene capacidad limitada, todo el sitema se ve afectado
    </div>

  </div>

  <script>
    function restartAnimation() {
      const wrapper = document.getElementById('flowWrapper');
      const clone = wrapper.cloneNode(true);
      wrapper.parentNode.replaceChild(clone, wrapper);
    }
  </script>

</body>
</html>
